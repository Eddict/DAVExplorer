name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [11, 17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build with make
        run: make

      - name: Verify jar was produced
        run: test -f DAVExplorer.jar

      - name: Upload DAVExplorer.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAVExplorer-jdk${{ matrix.java }}
          path: DAVExplorer.jar
          if-no-files-found: error
